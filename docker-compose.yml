# =====================================================================
# WalletPK: full stack entry point.
#
#   docker compose up -d                    # infrastructure only (Postgres, Redis, Kafka, ...)
#   docker compose --profile apps up -d     # infrastructure + WalletPK services in containers
#
# While developing you normally run services with `dotnet run` and only the
# infrastructure in Docker. Services are added here module by module.
# =====================================================================
include:
  - docker-compose.infra.yml

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  networks: [walletpk]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Gateway/WalletPK.Gateway/Dockerfile
    image: walletpk/gateway:dev
    container_name: walletpk-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Observability__WriteToConsole: "true"
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
      Jwt__Authority: http://identity:8080/
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity:8080/
      ReverseProxy__Clusters__ledger__Destinations__d1__Address: http://ledger:8080/
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      seq:
        condition: service_started
      jaeger:
        condition: service_started

  identity:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Identity/WalletPK.Identity.Api/Dockerfile
    image: walletpk/identity:dev
    container_name: walletpk-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=walletpk_identity;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-walletpk_dev},abortConnect=false
      # Dev signing key, created on first start; /tmp because the container runs as a non-root user
      Jwt__SigningKeyPath: /tmp/walletpk-keys/identity-signing-key.pem
      # REST on 8080 (via the gateway), internal gRPC on 8081 (HTTP/2 only, called by other services)
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${IDENTITY_PORT:-5101}:8080"
      - "${IDENTITY_GRPC_PORT:-5201}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ledger:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Ledger/WalletPK.Ledger.Api/Dockerfile
    image: walletpk/ledger:dev
    container_name: walletpk-ledger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LedgerDb: Host=postgres;Port=5432;Database=walletpk_ledger;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${LEDGER_PORT:-5102}:8080"
    depends_on:
      postgres:
        condition: service_healthy
