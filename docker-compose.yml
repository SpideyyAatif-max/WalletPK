# =====================================================================
# WalletPK: full stack entry point.
#
#   docker compose up -d                    # infrastructure only (Postgres, Redis, Kafka, ...)
#   docker compose --profile apps up -d     # infrastructure + WalletPK services in containers
#
# While developing you normally run services with `dotnet run` and only the
# infrastructure in Docker. Services are added here module by module.
# =====================================================================
include:
  - docker-compose.infra.yml

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  networks: [walletpk]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Gateway/WalletPK.Gateway/Dockerfile
    image: walletpk/gateway:dev
    container_name: walletpk-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Observability__WriteToConsole: "true"
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
      Jwt__Authority: http://identity:8080/
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity:8080/
      ReverseProxy__Clusters__ledger__Destinations__d1__Address: http://ledger:8080/
      ReverseProxy__Clusters__payments__Destinations__d1__Address: http://payments:8080/
      ReverseProxy__Clusters__bills__Destinations__d1__Address: http://bills:8080/
      ReverseProxy__Clusters__topup-merchant__Destinations__d1__Address: http://topup-merchant:8080/
      ReverseProxy__Clusters__agents__Destinations__d1__Address: http://agents:8080/
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      seq:
        condition: service_started
      jaeger:
        condition: service_started

  identity:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Identity/WalletPK.Identity.Api/Dockerfile
    image: walletpk/identity:dev
    container_name: walletpk-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=walletpk_identity;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-walletpk_dev},abortConnect=false
      # Dev signing key, created on first start; /tmp because the container runs as a non-root user
      Jwt__SigningKeyPath: /tmp/walletpk-keys/identity-signing-key.pem
      # REST on 8080 (via the gateway), internal gRPC on 8081 (HTTP/2 only, called by other services)
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      # The outbox relay publishes identity.events here (topics are created by kafka-init).
      Kafka__BootstrapServers: kafka:9092
      # KYC checks go to the mock NADRA over HTTP (M5.5) instead of the in-process stand-in.
      Nadra__Mode: Http
      Nadra__BaseUrl: http://mock-providers:8080/
      Nadra__ApiKey: dev-only-provider-client-key
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${IDENTITY_PORT:-5101}:8080"
      - "${IDENTITY_GRPC_PORT:-5201}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mock-providers:
        condition: service_started

  ledger:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Ledger/WalletPK.Ledger.Api/Dockerfile
    image: walletpk/ledger:dev
    container_name: walletpk-ledger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LedgerDb: Host=postgres;Port=5432;Database=walletpk_ledger;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-walletpk_dev},abortConnect=false
      # Access tokens are validated with Identity's published keys; limits are checked over Identity's gRPC port.
      Jwt__Authority: http://identity:8080/
      Services__IdentityGrpc__Address: http://identity:8081
      # Publishes ledger.events, consumes identity.events (opens a wallet for every new user).
      Kafka__BootstrapServers: kafka:9092
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${LEDGER_PORT:-5102}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      identity:
        condition: service_started

  # Payments (M6): bank transfers over Raast, one Saga per transfer. Sends hold commands to the Ledger
  # (ledger.commands), reads its replies (ledger.replies), publishes payments.events, calls Raast (the mock
  # providers) through a resilience pipeline per bank, and receives Raast's callbacks through the gateway.
  payments:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Payments/WalletPK.Payments.Api/Dockerfile
    image: walletpk/payments:dev
    container_name: walletpk-payments
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDb: Host=postgres;Port=5432;Database=walletpk_payments;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      Jwt__Authority: http://identity:8080/
      Kafka__BootstrapServers: kafka:9092
      Providers__Raast__BaseUrl: http://mock-providers:8080/
      Providers__Raast__ApiKey: dev-only-provider-client-key
      Webhooks__Raast__Secret: dev-only-raast-webhook-secret
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${PAYMENTS_PORT:-5103}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger:
        condition: service_started
      mock-providers:
        condition: service_started

  # Bill Payment (M7): biller inquiry and payment Sagas (status query before retry, pending verification,
  # dead-letter queue bills.dlq), saved billers and due-date reminders. Talks to the Ledger over Kafka
  # (holds) and to the billers (the mock providers) through a resilience pipeline per biller.
  bills:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Bills/WalletPK.Bills.Api/Dockerfile
    image: walletpk/bills:dev
    container_name: walletpk-bills
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BillsDb: Host=postgres;Port=5432;Database=walletpk_bills;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      Jwt__Authority: http://identity:8080/
      Kafka__BootstrapServers: kafka:9092
      Providers__Billers__BaseUrl: http://mock-providers:8080/
      Providers__Billers__ApiKey: dev-only-provider-client-key
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${BILLS_PORT:-5104}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger:
        condition: service_started
      mock-providers:
        condition: service_started

  # Top-up & Merchant (M8): mobile top-up Sagas (status query before retry, dead-letter queue topup.dlq),
  # merchant onboarding and fee plans, signed dynamic QR codes, QR payments with the fee split off, and
  # nightly settlement. Talks to the Ledger over Kafka and to the networks (the mock providers).
  topup-merchant:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/TopupMerchant/WalletPK.TopupMerchant.Api/Dockerfile
    image: walletpk/topup-merchant:dev
    container_name: walletpk-topup-merchant
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TopupMerchantDb: Host=postgres;Port=5432;Database=walletpk_topup_merchant;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      Jwt__Authority: http://identity:8080/
      Kafka__BootstrapServers: kafka:9092
      Providers__Telcos__BaseUrl: http://mock-providers:8080/
      Providers__Telcos__ApiKey: dev-only-provider-client-key
      Merchants__Qr__SigningKey: ${QR_SIGNING_KEY:-dev-only-qr-signing-key-change-me-in-production}
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${TOPUP_MERCHANT_PORT:-5105}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger:
        condition: service_started
      mock-providers:
        condition: service_started

  # Agent Network (M9): agent onboarding and floats, cash-in, cash-out with one-time codes, and nightly
  # commission payouts. Talks to the Ledger over Kafka. Development approves new agents at once.
  agents:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/Services/Agents/WalletPK.Agents.Api/Dockerfile
    image: walletpk/agents:dev
    container_name: walletpk-agents
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AgentsDb: Host=postgres;Port=5432;Database=walletpk_agents;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      Jwt__Authority: http://identity:8080/
      Kafka__BootstrapServers: kafka:9092
      Agents__CashOutCodeKey: ${CASH_OUT_CODE_KEY:-dev-only-cash-out-code-key-change-me-in-production}
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${AGENTS_PORT:-5106}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger:
        condition: service_started

  # Mock external providers (M5): Raast and banks, billers, telcos, NADRA, with runtime faults and
  # settlement files. Internal: services call it on the compose network; port 5200 is for you and tests.
  # Control API example:  curl -X PUT localhost:5200/admin/faults/biller:KE -H "X-Admin-Key: dev-only-provider-admin-key"
  #                            -H "Content-Type: application/json" -d '{"timeoutRate": 1}'
  mock-providers:
    <<: *dotnet-service
    profiles: [apps]
    build:
      context: .
      dockerfile: src/MockProviders/WalletPK.MockProviders/Dockerfile
    image: walletpk/mock-providers:dev
    container_name: walletpk-mock-providers
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MockProvidersDb: Host=postgres;Port=5432;Database=walletpk_mockproviders;Username=${POSTGRES_USER:-walletpk};Password=${POSTGRES_PASSWORD:-walletpk_dev}
      # Raast confirmations go to WalletPK's webhook through the gateway, signed with the gateway's raast secret.
      MockProviders__Raast__CallbackUrl: http://gateway:8080/webhooks/raast/transfer-status
      MockProviders__Raast__CallbackSecret: dev-only-raast-webhook-secret
      Observability__SeqUrl: http://seq:5341
      Observability__OtlpTracesEndpoint: http://jaeger:4317
      Observability__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "${MOCK_PROVIDERS_PORT:-5200}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Web app (M4.7): the customer wallet at http://localhost:3000. The browser talks to the gateway on
  # localhost:5000 (REST + /hubs/wallet); the Next.js server keeps the refresh token in a cookie and
  # reaches the gateway over the compose network.
  web:
    profiles: [apps]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-5000}
        NEXT_PUBLIC_DEV_TOOLS: "true"
    image: walletpk/web:dev
    container_name: walletpk-web
    environment:
      API_URL: http://gateway:8080
      # Plain http on localhost: Secure cookies would be dropped by some browsers.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_started
    networks: [walletpk]
