# WalletPK continuous integration: runs on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore WalletPK.sln

      # Release build with warnings as errors (from Directory.Build.props), same rules as local builds.
      - name: Build
        run: dotnet build WalletPK.sln --configuration Release --no-restore

      # One HTML + TRX report per test project, kept as a downloadable artifact of this run.
      - name: Test (with reports)
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoBuild

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30

  infrastructure:
    name: Validate infrastructure config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate Docker Compose files
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check shell script syntax
        run: |
          bash -n ops/kafka/create-topics.sh
          bash -n ops/postgres/init/02-extensions.sh
