# Weekly pull requests to keep dependencies current. Related packages are grouped into one PR.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    groups:
      # Microsoft ships these together (10.0.x patches); one PR, or restore fails on mixed versions.
      dotnet-platform:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.*", "dotnet-ef"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      serilog:
        patterns: ["Serilog*"]
      testing:
        patterns: ["xunit*", "Shouldly"]
    ignore:
      # Stay on .NET 10 (LTS); .NET 11 is a short-term release.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # Majors that do not fit yet: Next's lint plugins support ESLint 9 only, typescript-eslint does
      # not support TypeScript 7, Node types follow the Node 22 runtime, and the SignalR client follows
      # the server (.NET 10).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Karachi

  # Local tooling images: monthly is enough, and each update means a large download.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Karachi
    open-pull-requests-limit: 3
    ignore:
      # Stay on the Prometheus 3.13 long-term-support line (patch updates only).
      - dependency-name: prom/prometheus
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
