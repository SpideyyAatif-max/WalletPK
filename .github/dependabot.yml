# Weekly pull requests to keep dependencies current. Related packages are grouped into one PR.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      serilog:
        patterns: ["Serilog*"]
      testing:
        patterns: ["xunit*", "Shouldly", "Microsoft.AspNetCore.TestHost"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Karachi

  # Local tooling images: monthly is enough, and each update means a large download.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Karachi
    open-pull-requests-limit: 3
    ignore:
      # Stay on the Prometheus 3.13 long-term-support line (patch updates only).
      - dependency-name: prom/prometheus
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
